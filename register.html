<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta | JuniorNet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-page">
    <form class="auth-card" id="registerForm">
      <h1>Crear cuenta</h1>
      <p>Entrá a JuniorNet y empezá a publicar.</p>

      <label>Nombre de usuario</label>
      <input type="text" id="registerUsername" placeholder="Ej: LucianoDev" required minlength="3" />

      <label>Email</label>
      <input type="email" id="registerEmail" placeholder="tu@email.com" required />

      <label>Contraseña</label>
      <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required minlength="6" />

      <button class="btn primary full" type="submit">Registrarme</button>

      <p class="small">
        ¿Ya tenés cuenta?
        <a href="login.html">Iniciar sesión</a>
      </p>

      <p class="message" id="registerMessage"></p>
    </form>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
