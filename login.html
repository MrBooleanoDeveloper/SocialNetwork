<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | JuniorNet</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="auth-page">
    <form class="auth-card" id="loginForm">
      <h1>Iniciar sesión</h1>
      <p>Volvé a tu feed.</p>

      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="tu@email.com" required />

      <label>Contraseña</label>
      <input type="password" id="loginPassword" placeholder="Tu contraseña" required />

      <button class="btn primary full" type="submit">Entrar</button>

      <p class="small">
        ¿No tenés cuenta?
        <a href="./register.html">Crear cuenta</a>
      </p>

      <p class="message" id="loginMessage"></p>
    </form>
  </main>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
