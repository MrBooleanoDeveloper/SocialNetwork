<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed | JuniorNet</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./feed.html">JuniorNet</a>

    <nav>
      <a href="./feed.html">Feed</a>
      <a href="./profile.html">Perfil</a>
      <button id="logoutBtn" class="logout">Salir</button>
    </nav>
  </header>

  <main class="app-layout">
    <section class="composer card">
      <h2>Crear publicación</h2>

      <form id="postForm">
        <textarea id="postText" placeholder="¿Qué estás creando hoy?" maxlength="400" required></textarea>
        <div class="composer-bottom">
          <span id="charCount">0/400</span>
          <button class="btn primary" type="submit">Publicar</button>
        </div>
      </form>

      <p class="message" id="postMessage"></p>
    </section>

    <section>
      <h2 class="section-title">Feed global</h2>
      <div id="postsContainer" class="posts"></div>
    </section>
  </main>

  <script type="module" src="./js/auth.js"></script>
  <script type="module" src="./js/feed.js"></script>
</body>
</html>
